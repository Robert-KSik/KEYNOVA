

{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | KEYNOVA</title>
    <link rel="stylesheet" href="{% static 'products/style.css' %}">
    <style>
        body {
            background: #0c0b10;
            color: #f5f3ff;
            font-family: Arial, sans-serif;
        }
        .auth-container {
            max-width: 420px;
            margin: 80px auto;
            padding: 36px;
            background: #171520;
            border: 1px solid #30283f;
            border-radius: 20px;
        }
        .brand {
            color: #c4b5fd;
            font-size: 13px;
            letter-spacing: 4px;
            text-align: center;
        }
        h1 { text-align: center; margin-bottom: 8px; }
        .subtitle {
            color: #aaa4bd;
            text-align: center;
            margin-bottom: 28px;
        }
        label { display: block; margin: 18px 0 8px; }
        input {
            box-sizing: border-box;
            width: 100%;
            padding: 13px;
            border-radius: 9px;
            border: 1px solid #393247;
            background: #0c0b10;
            color: white;
        }
        button {
            width: 100%;
            margin-top: 24px;
            padding: 14px;
            background: #a78bfa;
            color: #171520;
            font-weight: bold;
            border: none;
            border-radius: 9px;
            cursor: pointer;
        }
        .auth-footer {
            text-align: center;
            margin-top: 24px;
            color: #aaa4bd;
        }
        a { color: #c4b5fd; }
        .errorlist { color: #fca5a5; }
        .helptext { color: #aaa4bd; font-size: 12px; }
    </style>
</head>
<body>
    <main class="auth-container">
        <p class="brand">KEYNOVA</p>
        <h1>Welcome back.</h1>
        <p class="subtitle">Sign in to your account.</p>

        <form method="post">
            {% csrf_token %}

            {{ form.non_field_errors }}

            {% for field in form %}
                <label for="{{ field.id_for_label }}">
                    {{ field.label }}
                </label>
                {{ field }}
                {{ field.errors }}
            {% endfor %}

            <button type="submit">Sign In →</button>
        </form>

        <p class="auth-footer">
            New here?
            <a href="{% url 'accounts:register' %}">Create an account</a>
        </p>

        <p class="auth-footer">
            <a href="/">← Back to store</a>
        </p>
    </main>
</body>
</html>
